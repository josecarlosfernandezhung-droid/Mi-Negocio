name: Build Gestión Negocio APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Preparar proyecto Android (Capacitor)
        run: |
          npx cap add android || true

      - name: Permitir conexión HTTP a la red local (servidor de pedidos)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic "$M" || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$M"
          grep -n "usesCleartextTraffic" "$M"

      - name: Generar iconos y splash screen
        run: npx @capacitor/assets generate --android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compilar APK debug (sin firmar)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: gestion-negocio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
